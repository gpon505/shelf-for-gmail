<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shelf test suite</title>
<link rel="stylesheet" href="/shelf.css">
<style>
  body { font: 14px -apple-system, Arial, sans-serif; margin: 16px; }
  table.F { width: 700px; border-collapse: collapse; }
  /* classic Gmail rows are height-locked (~40px); the card-row detection
     keys on geometry, so the fixture must match */
  tr.zA td { padding: 0 8px; height: 40px; border-top: 1px solid #eee; white-space: nowrap; }
  /* Gmail renders the hover toolbar inline; unstyled it stacks and inflates rows */
  tr.zA ul[role="toolbar"] { display: inline-flex; align-items: center; list-style: none; margin: 0; padding: 0; vertical-align: middle; }
  #out { margin-top: 20px; font: 13px Menlo, monospace; }
  #out .ok { color: #188038; }
  #out .fail { color: #c5221f; font-weight: bold; }
  h1 { font-size: 16px; }
</style>
</head>
<body>
<h1>Shelf regression suite</h1>
<script>
window.chrome = {
  runtime: { lastError: null, id: 'testextensionid00000000000000000' },
  storage: {
    local: {
      _d: {
        sections: {
          Action: {
            list: [
              { id: 'aaa', name: 'Summer', collapsed: false },
              { id: 'bbb', name: 'Eagle Peak', collapsed: false }
            ],
            elseCollapsed: false
          }
        },
        sectionsRev: 1,
        assignments: { t1: { s: 'aaa', t: 1 }, t2: { s: 'bbb', t: 2 } },
        'note:t1': { text: 'existing note', t: 1, c: 'yellow' },
        fileCount: 40,
        fileDays: ['2026-07-01', '2026-07-05', '2026-07-09', '2026-07-13', '2026-07-17'],
        firstUse: 1752000000000,
        hintDone: true,
        labs: { rules: true, aging: true, kits: true }
      },
      get(k, cb) { cb(Object.assign({}, this._d)); },
      set(o, cb) { Object.assign(this._d, o); if (cb) cb(); },
      remove(k, cb) { delete this._d[k]; if (cb) cb(); }
    },
    sync: {
      get(k, cb) { cb({}); },
      set(o, cb) { if (cb) cb(); },
      remove(k, cb) { if (cb) cb(); }
    },
    onChanged: { addListener() {} }
  }
};
location.hash = '#label/Action';
localStorage.setItem('shelfDebug', '1');
window.__logs = [];
(() => {
  const orig = console.log.bind(console);
  console.log = (...a) => {
    window.__logs.push(a.map((x) => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' '));
    orig(...a);
  };
})();
</script>
<table class="F"><tbody id="tb"></tbody></table>
<script>
// build 8 rows: t1/t2 pre-filed, t3–t8 unfiled
const tb = document.getElementById('tb');
for (let i = 1; i <= 8; i++) {
  const tr = document.createElement('tr');
  tr.className = 'zA';
  tr.innerHTML =
    '<td style="width:0;padding:0"></td>' +
    '<td><span role="checkbox" aria-checked="false">▢</span></td>' +
    '<td><span data-legacy-thread-id="t' + i + '" email="sender' + i + '@ex.com"></span>Sender ' + i + '</td>' +
    '<td><span class="bog">Subject ' + i + '</span><ul role="toolbar"></ul></td>';
  tb.appendChild(tr);
}
</script>
<script src="/content.js?v=37"></script>
<div id="out"></div>
<script>
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const $  = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const store = () => window.chrome.storage.local._d;
const rowById = (id) => $$('tr.zA').find((r) =>
  r.querySelector('[data-legacy-thread-id]').getAttribute('data-legacy-thread-id') === id);
// grouping is now VISUAL (translateY transforms) — DOM order never changes.
// Visual order = rows sorted by their on-screen top.
const visualOrder = () => $$('tr.zA')
  .filter((r) => r.offsetParent && !r.classList.contains('shelf-hidden'))
  .map((r) => ({ id: r.querySelector('[data-legacy-thread-id]').getAttribute('data-legacy-thread-id'),
                 y: r.getBoundingClientRect().top }))
  .sort((a, b) => a.y - b.y)
  .map((x) => x.id);
const headerBySec = (id) => $$('.shelf-header').find((h) => h.dataset.shelfSection === id);
const mouse = (n, type, x, y, extra) => n.dispatchEvent(new MouseEvent(type,
  Object.assign({ bubbles: true, cancelable: true, button: 0, clientX: x || 0, clientY: y || 0 }, extra || {})));
const clickEl = (n) => mouse(n, 'click');
const keyOn = (n, opts) => n.dispatchEvent(new KeyboardEvent('keydown',
  Object.assign({ bubbles: true, cancelable: true }, opts)));
const closeMenus = () => document.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
const center = (n) => { const r = n.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

function drag(fromEl, toX, toY) {
  const [x, y] = center(fromEl);
  mouse(fromEl, 'mousedown', x, y);
  mouse(document, 'mousemove', x + 3, y + 8); // pass threshold
  mouse(document, 'mousemove', toX, toY);
  mouse(document, 'mouseup', toX, toY);
}

function assert(cond, msg) { if (!cond) throw new Error(msg); }

async function waitFor(cond, timeout, what) {
  const t0 = Date.now();
  while (Date.now() - t0 < (timeout || 3000)) {
    const v = cond();
    if (v) return v;
    await sleep(100);
  }
  throw new Error('timed out waiting for ' + (what || 'condition'));
}

const results = [];
async function t(name, fn) {
  try {
    await fn();
    results.push({ name, ok: true });
  } catch (err) {
    const msg = String(err && err.message || err);
    if (msg.indexOf('SKIP') === 0) results.push({ name, ok: true, skip: true, err: msg });
    else results.push({ name, ok: false, err: msg });
  }
}

// drag drop-targeting uses elementsFromPoint, which needs a real viewport;
// hidden panes report 0x0 and can't hit-test
function needViewport(el) {
  if (window.innerHeight < 100) throw new Error('SKIP: zero-size viewport (hidden pane) — drag hit-testing unavailable');
  if (el) el.scrollIntoView({ block: 'center' });
}

(async () => {
  await sleep(500); // initial render

  await t('renders sections and Everything else', async () => {
    const names = $$('.shelf-header .shelf-name').map((n) => n.textContent);
    assert(names.join('|') === 'Summer|Eagle Peak|Everything else', 'got: ' + names.join('|'));
  });

  await t('labs: filed threads show their age (aging on)', async () => {
    // t1 was filed at epoch — decades old, so the counter must be hot
    const age = rowById('t1').querySelector('.shelf-age');
    assert(age, 'age counter missing on old filed thread');
    assert(/^\d+d$/.test(age.textContent), 'age text wrong: ' + age.textContent);
    assert(age.classList.contains('shelf-age-hot'), 'old thread not marked hot');
    assert(!rowById('t4').querySelector('.shelf-age'), 'unfiled thread should have no age');
  });

  await t('rapid Gmail row churn coalesces and regroups correctly', async () => {
    // simulate Gmail rebuilding the list twice in quick succession (what
    // keyboard nav does): the pre-paint scheduleSyncRender path must still
    // land every row in its section, with no loss or duplication
    const tb = document.querySelector('table.F tbody');
    const mk = (id, sec) => {
      store().assignments[id] = { s: sec, t: Date.now() };
      const tr = document.createElement('tr');
      tr.className = 'zA';
      tr.innerHTML = '<td style="width:0;padding:0"></td>' +
        '<td><span role="checkbox" aria-checked="false">▢</span></td>' +
        '<td><span data-legacy-thread-id="' + id + '"></span>Sender ' + id + '</td>' +
        '<td><span class="bog">Subject ' + id + '</span><ul role="toolbar"></ul></td>';
      return tr;
    };
    tb.appendChild(mk('rc1', 'aaa'));   // first burst
    await sleep(5);
    tb.appendChild(mk('rc2', 'bbb'));   // second burst within the throttle window
    await sleep(400);
    // both new rows grouped into their sections, exactly once each
    const seq = $$('tr.zA').map((r) => r.querySelector('[data-legacy-thread-id]').getAttribute('data-legacy-thread-id'));
    assert(seq.filter((x) => x === 'rc1').length === 1, 'rc1 duplicated or lost: ' + seq.join(','));
    assert(seq.filter((x) => x === 'rc2').length === 1, 'rc2 duplicated or lost');
    assert($$('.shelf-header').length >= 3, 'grouping missing after churn');
    // cleanup
    rowById('rc1').remove(); rowById('rc2').remove();
    delete store().assignments.rc1; delete store().assignments.rc2;
    const poke = document.createElement('i'); document.body.appendChild(poke);
    await sleep(200); poke.remove();
  });

  await t('review banner shows when gate met, dismiss persists', async () => {
    const b = $('.shelf-review');
    assert(b, 'banner missing');
    clickEl(b.querySelector('.shelf-hint-x'));
    await sleep(250);
    assert(!$('.shelf-review'), 'banner not removed');
    assert(store().reviewDone === true, 'reviewDone not persisted');
  });

  await t('row drag files a thread onto a shelf', async () => {
    const row = rowById('t3');
    const hdr = headerBySec('aaa');
    needViewport(hdr);
    const [hx, hy] = center(hdr);
    // sample viewport state at drag time — elementsFromPoint (drop targeting)
    // returns nothing in a hidden/zero-size viewport; that's the environment,
    // not Shelf, and visibility can flip between drag and assert
    const vpAtDrag = document.elementsFromPoint(hx, hy)
      .some((n) => n.closest && n.closest('.shelf-header') === hdr);
    drag(row.children[2], hx, hy);
    await sleep(600);
    if (!(store().assignments.t3 && store().assignments.t3.s === 'aaa')) {
      if (!vpAtDrag) throw new Error('SKIP: viewport hidden during drag — hit-testing unavailable');
      throw new Error('assignment missing: ' + JSON.stringify(store().assignments.t3));
    }
  });

  await t('drag reorders threads within a section', async () => {
    // t1 and t3 both live in aaa now; drag t1 below t3
    const r1 = rowById('t1');
    const r3 = rowById('t3');
    needViewport(r3);
    const rr3 = r3.getBoundingClientRect();
    const cx = center(r3.children[2])[0];
    const vpAtDrag = document.elementsFromPoint(cx, rr3.bottom - 4)
      .some((n) => n.closest && n.closest('tr.zA') === r3);
    drag(r1.children[2], cx, rr3.bottom - 4);
    await sleep(600);
    const a1 = store().assignments.t1;
    const a3 = store().assignments.t3;
    if (!(a1 && a1.r != null)) {
      if (!vpAtDrag) throw new Error('SKIP: viewport hidden during drag — hit-testing unavailable');
      const stack = document.elementsFromPoint(cx, rr3.bottom - 4)
        .map((n) => n.tagName + '.' + String(n.className).slice(0, 24)).join(' | ');
      const ovg = [...document.querySelectorAll('.shelf-ov > *')]
        .map((h) => ((h.querySelector('.shelf-name') || {}).textContent || h.className) + '@' + Math.round(h.getBoundingClientRect().top)).join(', ');
      throw new Error('no rank stored: ' + JSON.stringify(a1) +
        ' | drop@' + Math.round(cx) + ',' + Math.round(rr3.bottom - 4) +
        ' | t3vis@' + Math.round(rowById('t3').getBoundingClientRect().top) +
        ' | stack: ' + stack + ' | ov: ' + ovg +
        ' | logs: ' + (window.__logs || []).filter((l) => /rowdrag|row drop/.test(l)).slice(-4).join(' ~ '));
    }
    assert(a1.s === 'aaa' && a3 && a3.s === 'aaa', 'sections changed');
    assert(a1.r > a3.r, 'rank order wrong: t1=' + a1.r + ' t3=' + a3.r);
    const seq2 = visualOrder();
    assert(seq2.indexOf('t1') > seq2.indexOf('t3'), 'visual order: ' + seq2.join(','));
  });

  await t('sub-shelves: create, indent, file into, collapse cascade', async () => {
    clickEl(headerBySec('aaa').querySelector('.shelf-more'));
    const add = $$('.shelf-menu .shelf-mi').find((m) => m.textContent.indexOf('Add sub-shelf') === 0);
    assert(add, 'Add sub-shelf missing from menu');
    clickEl(add);
    const input = $('.shelf-menu .shelf-input');
    input.value = 'Interviews';
    keyOn(input, { key: 'Enter' });
    await sleep(400);
    const sub = store().sections.Action.list.find((s) => s.p === 'aaa');
    assert(sub && sub.name === 'Interviews', 'not stored: ' + JSON.stringify(store().sections.Action.list));
    const subHdr = headerBySec(sub.id);
    assert(subHdr && subHdr.classList.contains('shelf-sub'), 'no indented sub header');
    // the sub-header pill inherits the parent's color (matching chips)
    clickEl(headerBySec('aaa').querySelector('.shelf-more'));
    clickEl($('.shelf-menu .shelf-sw-red'));
    closeMenus();
    await sleep(400);
    assert(headerBySec(sub.id).classList.contains('shelf-hc-red'), 'sub pill did not inherit parent color');
    // a genuinely gray parent DOES give a gray sub pill (gray is a real color)
    clickEl(headerBySec('aaa').querySelector('.shelf-more'));
    clickEl($('.shelf-menu .shelf-sw-gray'));
    closeMenus();
    await sleep(400);
    assert(headerBySec(sub.id).classList.contains('shelf-hc-gray'), 'genuinely-gray parent should give a gray sub pill');
    clickEl(headerBySec('aaa').querySelector('.shelf-more'));
    clickEl($('.shelf-menu .shelf-sw-none'));
    closeMenus();
    await sleep(400);
    // uncolored parent → uncolored (plain) sub, matching it — NOT a gray pill
    assert(!headerBySec(sub.id).classList.contains('shelf-hc-red'), 'sub pill color not cleared');
    assert(!headerBySec(sub.id).className.match(/shelf-hc-\w/), 'uncolored sub should be plain, not a gray pill: ' + headerBySec(sub.id).className);
    // file t7 into the sub-shelf via the ☰ menu (indented entry)
    const row7 = rowById('t7');
    const btn = row7.querySelector('.shelf-btn-assign');
    const br = btn.getBoundingClientRect();
    btn.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientX: br.left + 3, clientY: br.top + 3, button: 0 }));
    mouse(document, 'mouseup', br.left + 3, br.top + 3);
    const mi = $$('.shelf-menu .shelf-mi').find((m) => m.textContent.trim() === 'Interviews');
    assert(mi && mi.classList.contains('shelf-mi-sub'), 'assign menu missing indented child');
    clickEl(mi);
    await sleep(500);
    assert(store().assignments.t7.s === sub.id, 'not filed into sub-shelf');
    assert(!headerBySec(sub.id).className.match(/shelf-hc-\w/), 'uncolored sub (uncolored parent) should stay plain: ' + headerBySec(sub.id).className);
    assert(rowById('t7').querySelector('td.shelf-rc-cell'), 'anchor cell missing');
    // collapsing the parent hides the child header and its rows
    clickEl(headerBySec('aaa').querySelector('.shelf-h'));
    await sleep(400);
    assert(!headerBySec(sub.id), 'child header still visible under collapsed parent');
    assert(rowById('t7').classList.contains('shelf-hidden'), 'child rows not hidden');
    clickEl(headerBySec('aaa').querySelector('.shelf-h'));
    await sleep(400);
    assert(headerBySec(sub.id), 'child header did not return on expand');
    // cleanup: unfile t7 so later tests see it unchanged
    delete store().assignments.t7;
  });

  await t('multi-select pill files several at once', async () => {
    rowById('t4').querySelector('[role="checkbox"]').setAttribute('aria-checked', 'true');
    rowById('t5').querySelector('[role="checkbox"]').setAttribute('aria-checked', 'true');
    await sleep(1200);
    const viaAttr = !!$('.shelf-multibar');
    const poke = document.createElement('i');
    document.body.appendChild(poke);
    await sleep(600);
    poke.remove();
    const viaPoke = !!$('.shelf-multibar');
    assert(viaAttr || viaPoke, 'multibar missing (attr-render: ' + viaAttr + ', poke-render: ' + viaPoke + ')');
    const bar = $('.shelf-multibar');
    assert(bar.textContent.indexOf('2 selected') !== -1, 'count wrong: ' + bar.textContent);
    clickEl(bar.querySelector('.shelf-multibar-btn'));
    const mi = $$('.shelf-menu .shelf-mi').find((m) => m.textContent.trim() === 'Eagle Peak');
    assert(mi, 'menu item missing');
    clickEl(mi);
    await sleep(500);
    assert(store().assignments.t4.s === 'bbb' && store().assignments.t5.s === 'bbb', 'not both filed');
    rowById('t4').querySelector('[role="checkbox"]').setAttribute('aria-checked', 'false');
    rowById('t5').querySelector('[role="checkbox"]').setAttribute('aria-checked', 'false');
    await sleep(300);
  });

  await t('header drag reorders sections', async () => {
    const eagle = headerBySec('bbb').querySelector('.shelf-h');
    const summer = headerBySec('aaa');
    needViewport(summer);
    drag(eagle, center(summer)[0], summer.getBoundingClientRect().top + 2);
    await sleep(600);
    const order = store().sections.Action.list.filter((s) => !s.p).map((s) => s.id).join(',');
    assert(order === 'bbb,aaa', 'top-level order: ' + order);
    // a parent's sub-shelves travel with it in the canonical flat list
    const flat = store().sections.Action.list;
    const ai = flat.findIndex((s) => s.id === 'aaa');
    const child = flat.find((s) => s.p === 'aaa');
    if (child) assert(flat[ai + 1] && flat[ai + 1].id === child.id, 'child not adjacent to parent');
  });

  await t('drag a shelf onto another nests it; menu promotes it back', async () => {
    const eagleH = headerBySec('bbb').querySelector('.shelf-h');
    const target = headerBySec('aaa');
    needViewport(target);
    const tr2 = target.getBoundingClientRect();
    const tx = center(target)[0];
    const ty = tr2.top + tr2.height / 2; // middle band = "drop into"
    const vpAtDrag = document.elementsFromPoint(tx, ty)
      .some((n) => n.closest && n.closest('.shelf-header') === target);
    drag(eagleH, tx, ty);
    await sleep(600);
    let bbb = store().sections.Action.list.find((x) => x.id === 'bbb');
    if (!(bbb && bbb.p === 'aaa')) {
      if (!vpAtDrag) throw new Error('SKIP: viewport hidden during drag — hit-testing unavailable');
      throw new Error('bbb not nested: ' + JSON.stringify(bbb));
    }
    assert(headerBySec('bbb').classList.contains('shelf-sub'), 'nested header not indented');
    assert(!$('.shelf-nest-target'), 'drop highlight not cleared after drop');
    // promote it back via the menu so later tests see the original shape
    clickEl(headerBySec('bbb').querySelector('.shelf-more'));
    const promote = $$('.shelf-menu .shelf-mi').find((m) => m.textContent.trim() === 'Make top-level shelf');
    assert(promote, 'promote item missing from sub-shelf menu');
    clickEl(promote);
    await sleep(500);
    bbb = store().sections.Action.list.find((x) => x.id === 'bbb');
    assert(bbb && !bbb.p, 'bbb still nested after promote');
    assert(headerBySec('bbb') && !headerBySec('bbb').classList.contains('shelf-sub'), 'promoted header still indented');
  });

  await t('drag a sub-shelf back to top level', async () => {
    const sub = store().sections.Action.list.find((s) => s.p === 'aaa');
    assert(sub, 'expected a sub-shelf under aaa in suite state');
    const bbbH = headerBySec('bbb');
    needViewport(bbbH);
    const br = bbbH.getBoundingClientRect();
    const tx = center(bbbH)[0];
    const ty = br.top + 2; // top edge = out-dent slot
    const vpAtDrag = document.elementsFromPoint(tx, ty)
      .some((n) => n.closest && n.closest('.shelf-header') === bbbH);
    drag(headerBySec(sub.id).querySelector('.shelf-h'), tx, ty);
    await sleep(600);
    let s2 = store().sections.Action.list.find((x) => x.id === sub.id);
    if (!(s2 && !s2.p)) {
      if (!vpAtDrag) throw new Error('SKIP: viewport hidden during drag — hit-testing unavailable');
      throw new Error('still nested: ' + JSON.stringify(s2));
    }
    const tops = store().sections.Action.list.filter((x) => !x.p).map((x) => x.id);
    assert(tops.indexOf(sub.id) === tops.indexOf('bbb') - 1, 'not placed before bbb: ' + tops.join(','));
    assert(!headerBySec(sub.id).classList.contains('shelf-sub'), 'promoted header still indented');
    // re-nest under aaa via the drop-into band so later tests see original shape
    const aaaH = headerBySec('aaa');
    const ar = aaaH.getBoundingClientRect();
    drag(headerBySec(sub.id).querySelector('.shelf-h'), center(aaaH)[0], ar.top + ar.height / 2);
    await sleep(600);
    s2 = store().sections.Action.list.find((x) => x.id === sub.id);
    assert(s2 && s2.p === 'aaa', 're-nest failed: ' + JSON.stringify(s2));
  });

  await t('"Everything else" can move to the top', async () => {
    // order-agnostic: earlier drag tests may leave either top-level order
    const firstId = store().sections.Action.list.filter((s) => !s.p)[0].id;
    const els = headerBySec(':else').querySelector('.shelf-h');
    const first = headerBySec(firstId);
    needViewport(first);
    drag(els, center(first)[0], first.getBoundingClientRect().top + 2);
    await sleep(600);
    assert(store().sections.Action.elseAt === 0,
      'elseAt: ' + store().sections.Action.elseAt + ' tops: ' +
      store().sections.Action.list.filter((s) => !s.p).map((s) => s.id).join(','));
  });

  await t('rename and reset "Everything else"', async () => {
    clickEl(headerBySec(':else').querySelector('.shelf-more'));
    const rename = $$('.shelf-menu .shelf-mi').find((m) => m.textContent.trim() === 'Rename');
    clickEl(rename);
    const input = $('.shelf-menu .shelf-input');
    input.value = 'Unsorted';
    keyOn(input, { key: 'Enter' });
    await sleep(300);
    assert(store().sections.Action.elseName === 'Unsorted', 'rename failed');
    clickEl(headerBySec(':else').querySelector('.shelf-more'));
    const reset = $$('.shelf-menu .shelf-mi').find((m) => m.textContent.indexOf('Reset') === 0);
    clickEl(reset);
    await sleep(300);
    assert(!store().sections.Action.elseName, 'reset failed');
  });

  await t('shelf color set and clear (6 swatches incl. gray)', async () => {
    clickEl(headerBySec('aaa').querySelector('.shelf-more'));
    const menu = $('.shelf-menu');
    assert(menu.querySelectorAll('.shelf-sw').length === 6, 'swatch count');
    clickEl(menu.querySelector('.shelf-sw-red'));
    await sleep(300);
    assert(headerBySec('aaa').classList.contains('shelf-hc-red'), 'class missing');
    clickEl(menu.querySelector('.shelf-sw-none'));
    await sleep(300);
    assert(!headerBySec('aaa').classList.contains('shelf-hc-red'), 'not cleared');
    closeMenus();
  });

  await t('Alt+N opens editor; ⌘Enter saves rich text', async () => {
    mouse(rowById('t6'), 'mouseover');
    keyOn(document.body, { altKey: true, code: 'KeyN', key: 'n' });
    const ed = $('.shelf-pop-ed');
    assert(ed, 'editor missing');
    ed.innerHTML = 'call <b>Laura</b>';
    ed.dispatchEvent(new Event('input', { bubbles: true }));
    keyOn(ed, { key: 'Enter', metaKey: true });
    await sleep(400);
    assert(!$('.shelf-pop-ed'), 'editor still open');
    const n = store()['note:t6'];
    assert(n && n.text === 'call Laura' && n.h && n.h.indexOf('<b>') !== -1,
      'saved: ' + JSON.stringify(n));
  });

  await t('URLs in notes become safe links', async () => {
    mouse(rowById('t7'), 'mouseover');
    keyOn(document.body, { altKey: true, code: 'KeyN', key: 'n' });
    const ed = $('.shelf-pop-ed');
    assert(ed, 'editor missing');
    ed.textContent = 'permission slip: https://school-forms.example.com/slip-42.';
    ed.dispatchEvent(new Event('input', { bubbles: true }));
    keyOn(ed, { key: 'Enter', metaKey: true });
    await sleep(400);

  await t('note editor: ⌘⇧8/9 formatting shortcuts', async () => {
    const pane = document.createElement('div');
    pane.innerHTML = '<div><h2 data-legacy-thread-id="t8">Subject eight</h2></div>';
    document.body.appendChild(pane);
    await sleep(400);
    keyOn(document.body, { altKey: true, code: 'KeyN', key: 'n' });
    const ed = $('.shelf-note-strip.shelf-editing .shelf-note-strip-t');
    assert(ed, 'editor did not open');
    ed.focus();
    ed.textContent = 'steps';
    const range = document.createRange();
    range.selectNodeContents(ed);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    keyOn(ed, { metaKey: true, shiftKey: true, code: 'Digit8', key: '8' });
    const gotUl = !!ed.querySelector('ul');
    keyOn(ed, { metaKey: true, shiftKey: true, code: 'Digit9', key: '9' });
    const gotCb = !!ed.querySelector('input[type="checkbox"]');
    let enterOk = true;
    let enterMsg = '';
    if (gotUl && gotCb) {
      // Enter continues a checklist; Enter on an empty box ends it
      ed.innerHTML = '';
      const r3 = document.createRange();
      r3.selectNodeContents(ed);
      sel.removeAllRanges();
      sel.addRange(r3);
      document.execCommand('insertHTML', false, '<input type="checkbox">&nbsp;task one');
      keyOn(ed, { key: 'Enter' });
      if (ed.querySelectorAll('input[type="checkbox"]').length !== 2) {
        enterOk = false;
        enterMsg = 'Enter did not continue checklist: ' + ed.innerHTML;
      }
      keyOn(ed, { key: 'Enter' });
      if (enterOk && ed.querySelectorAll('input[type="checkbox"]').length !== 1) {
        enterOk = false;
        enterMsg = 'Enter on empty box did not end checklist: ' + ed.innerHTML;
      }
      // ⌘⇧9 while on a checkbox line = next item, break included (the
      // "skips a line" fix): caret is back on the 'task one' line now
      keyOn(ed, { metaKey: true, shiftKey: true, code: 'Digit9', key: '9' });
      if (enterOk && !(ed.querySelectorAll('input[type="checkbox"]').length === 2 && /(<br>|<div>)/.test(ed.innerHTML))) {
        enterOk = false;
        enterMsg = '⌘⇧9 on a checkbox line did not start a new row: ' + ed.innerHTML;
      }
    }
    ed.innerHTML = '';
    keyOn(ed, { key: 'Escape' });
    await sleep(300);
    pane.remove();
    await sleep(200);
    if (!gotUl || !gotCb) {
      // headless Chrome ignores execCommand entirely (same reason the ⌘K
      // test simulates createLink's outcome) — probe before failing
      const probe = document.createElement('div');
      probe.contentEditable = 'true';
      probe.textContent = 'x';
      document.body.appendChild(probe);
      probe.focus();
      const r2 = document.createRange();
      r2.selectNodeContents(probe);
      sel.removeAllRanges();
      sel.addRange(r2);
      document.execCommand('insertUnorderedList');
      const envOk = !!probe.querySelector('ul');
      probe.remove();
      if (!envOk) throw new Error('SKIP: execCommand unavailable in this environment');
      throw new Error('shortcuts failed: ul=' + gotUl + ' cb=' + gotCb);
    }
    assert(enterOk, enterMsg);
  });

    const u1cleared = await pokeUntil(() => $$('.shelf-header').length === 0);
    const u1count = $$('.shelf-header').length;
    history.pushState({}, '', '/tools/test.html' + location.hash);
    const u0restored = await pokeUntil(() => $$('.shelf-header').length === n0);
    const u0count = $$('.shelf-header').length;
    assert(u1cleared, 'u/1 saw ' + u1count + ' headers');
    assert(u0restored, 'u/0 restore saw ' + u0count + ' (expected ' + n0 + ')');
  });

  await t('duplicate rows are Gmail\'s to manage — Shelf never removes a tr', async () => {
    // Under the pristine-tbody rule even a duplicate row must not be
    // removed by Shelf (removal shifts the click map exactly like insertion).
    const tbEl = document.getElementById('tb');
    const dup = document.createElement('tr');
    dup.className = 'zA';
    dup.innerHTML =
      '<td style="width:0;padding:0"></td>' +
      '<td><span role="checkbox" aria-checked="false">▢</span></td>' +
      '<td><span data-legacy-thread-id="t1" email="dup@ex.com"></span>Dup</td>' +
      '<td><span class="bog">Dup subject</span><ul role="toolbar"></ul></td>';
    tbEl.appendChild(dup);
    const poke = document.createElement('i');
    document.body.appendChild(poke);
    await sleep(400);
    poke.remove();
    assert(dup.isConnected, 'Shelf removed a Gmail row');
    dup.remove();
    await sleep(200);
  });

  await t('transform cleanup survives Gmail rewriting row classes', async () => {
    // Gmail rewrites row class attributes wholesale, which strips any Shelf
    // marker classes. Cleanup must sweep transforms by inline style, or a
    // stripped row stays visually displaced after grouping ends.
    const moved = $$('tr.zA').find((r) => r.style.transform);
    assert(moved, 'expected at least one transformed row in grouped state');
    moved.setAttribute('class', 'zA'); // simulate Gmail's wholesale rewrite
    location.hash = '#search/x';       // label-less view → full cleanup path
    window.dispatchEvent(new HashChangeEvent('hashchange'));
    await sleep(500);
    const stuck = $$('tr.zA').filter((r) => r.style.transform).length;
    assert(stuck === 0, stuck + ' rows kept stale transforms after cleanup');
    history.replaceState({}, '', location.pathname + '#label/Action');
    window.dispatchEvent(new HashChangeEvent('hashchange'));
    await sleep(400);
  });

  // report
  const out = document.getElementById('out');
  let passed = 0;
  for (const r of results) {
    const d = document.createElement('div');
    d.className = r.ok ? 'ok' : 'fail';
    d.textContent = (r.skip ? 'SKIP  ' : r.ok ? 'PASS  ' : 'FAIL  ') + r.name +
      (r.ok && !r.skip ? '' : ' — ' + (r.err || ''));
    out.appendChild(d);
    if (r.ok) passed++;
  }
  const sum = document.createElement('div');
  sum.style.marginTop = '10px';
  sum.style.fontWeight = 'bold';
  sum.textContent = passed + '/' + results.length + ' passed';
  out.appendChild(sum);
  window.__results = results;
  window.__done = true;
  document.title = passed === results.length ? 'PASS ' + passed + '/' + results.length
                                             : 'FAIL ' + passed + '/' + results.length;
})();
</script>
