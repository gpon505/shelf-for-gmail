  body { font: 14px -apple-system, Arial, sans-serif; margin: 16px; }
  table.F { width: 700px; border-collapse: collapse; }

     keys on geometry, so the fixture must match */

  /* Gmail renders the hover toolbar inline; unstyled it stacks and inflates rows */
  tr.zA ul[role="toolbar"] { display: inline-flex; align-items: center; list-style: none; margin: 0; padding: 0; vertical-align: middle; }
  #out { margin-top: 20px; font: 13px Menlo, monospace; }
  #out .ok { color: #188038; }
  #out .fail { color: #c5221f; font-weight: bold; }
  h1 { font-size: 16px; }
</style>

<h1>Shelf regression suite</h1>
<script>
window.chrome = {
  runtime: { lastError: null, id: 'testextensionid00000000000000000' },
  storage: {
    local: {
      _d: {
        sections: {
          Action: {
            list: [
              { id: 'aaa', name: 'Summer', collapsed: false },
              { id: 'bbb', name: 'Eagle Peak', collapsed: false }
            ],
            elseCollapsed: false
          }
        },
        sectionsRev: 1,
        assignments: { t1: { s: 'aaa', t: 1 }, t2: { s: 'bbb', t: 2 } },
        'note:t1': { text: 'existing note', t: 1, c: 'yellow' },
        // review gate starts fully closed except for files: 5 active days is
        // under the 8-day bar, 14 days is under the 30-day bar. The review
        // tests open one gate at a time from here, so each one is isolated.
        fileCount: 40,
        fileDays: ['2026-07-01', '2026-07-05', '2026-07-09', '2026-07-13', '2026-07-17'],
        // relative to now, not a fixed stamp, or the fixture silently ages
        // past every window it is supposed to be testing
        firstUse: Date.now() - 14 * 24 * 60 * 60 * 1000,
        hintDone: true,
        labs: { rules: true, aging: true, kits: true, cursor: true }
      },
      get(k, cb) { cb(Object.assign({}, this._d)); },
      set(o, cb) { Object.assign(this._d, o); if (cb) cb(); },
      remove(k, cb) { delete this._d[k]; if (cb) cb(); }
    },
    sync: {
      get(k, cb) { cb({}); },
      set(o, cb) { if (cb) cb(); },
      remove(k, cb) { if (cb) cb(); }
    },
    onChanged: {
      _l: [],
      addListener(f) { this._l.push(f); },
      // test hook: deliver a change event as chrome would
      _fire(changes, area) { for (const f of this._l) f(changes, area); }
    }
  }
};
location.hash = '#label/Action';
localStorage.setItem('shelfDebug', '1');
window.__logs = [];
(() => {
  const orig = console.log.bind(console);
  console.log = (...a) => {
    window.__logs.push(a.map((x) => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' '));
    orig(...a);
  };
})();
</script>

<script>
// ---- a stand-in for Gmail's keyboard cursor, modeled on measured behavior ----
// Real Gmail: the cursor row carries tabindex="0" (others -1) plus a marker
// class; j/k and the arrows move it one step through Gmail's own list (which
// is DOM order); and clicking a row's checkbox moves it to that row. That last
// lever is the only one Gmail honors from script, and it is what labs.cursor
// steers, so the fixture has to offer all three or the tests prove nothing.
(() => {
  const rows = () => [...document.querySelectorAll('tr.zA')];
  const live = () => rows().filter((r) => r.offsetParent && !r.classList.contains('shelf-hidden'));
  const setCur = (row) => rows().forEach((r) => {
    r.setAttribute('tabindex', r === row ? '0' : '-1');
    r.classList.toggle('btb', r === row);
  });
  setCur(rows()[0]);
  document.addEventListener('click', (e) => {
    const cb = e.target.closest && e.target.closest('[role="checkbox"]');
    if (!cb) return;
    cb.setAttribute('aria-checked', cb.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    const row = cb.closest('tr.zA');
    if (row) setCur(row); // Gmail moves its cursor to a checkbox you click
  }, false);
  document.addEventListener('keydown', (e) => {
    // capture-phase stopPropagation from Shelf means this never runs — which
    // is exactly how "Shelf swallowed the key" is modeled
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    const d = (e.key === 'j' || e.key === 'ArrowDown') ? 1
            : (e.key === 'k' || e.key === 'ArrowUp') ? -1 : 0;
    if (!d) return;
    const rs = live();
    const i = rs.findIndex((r) => r.getAttribute('tabindex') === '0');
    setCur(rs[Math.max(0, Math.min(rs.length - 1, (i < 0 ? 0 : i) + d))]);
  }, false);
})();
</script>

<div id="out"></div>
<script>
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const $  = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const store = () => window.chrome.storage.local._d;
const rowById = (id) => $$('tr.zA').find((r) =>
  r.querySelector('[data-legacy-thread-id]').getAttribute('data-legacy-thread-id') === id);
// grouping is now VISUAL (translateY transforms) — DOM order never changes.
// Visual order = rows sorted by their on-screen top.
const visualOrder = () => $$('tr.zA')
  .filter((r) => r.offsetParent && !r.classList.contains('shelf-hidden'))
  .map((r) => ({ id: r.querySelector('[data-legacy-thread-id]').getAttribute('data-legacy-thread-id'),
                 y: r.getBoundingClientRect().top }))
  .sort((a, b) => a.y - b.y)
  .map((x) => x.id);
const headerBySec = (id) => $$('.shelf-header').find((h) => h.dataset.shelfSection === id);
const mouse = (n, type, x, y, extra) => n.dispatchEvent(new MouseEvent(type,
  Object.assign({ bubbles: true, cancelable: true, button: 0, clientX: x || 0, clientY: y || 0 }, extra || {})));
const clickEl = (n) => mouse(n, 'click');
const keyOn = (n, opts) => n.dispatchEvent(new KeyboardEvent('keydown',
  Object.assign({ bubbles: true, cancelable: true }, opts)));
const closeMenus = () => document.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
const center = (n) => { const r = n.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

function drag(fromEl, toX, toY) {
  const [x, y] = center(fromEl);
  mouse(fromEl, 'mousedown', x, y);
  mouse(document, 'mousemove', x + 3, y + 8); // pass threshold
  mouse(document, 'mousemove', toX, toY);
  mouse(document, 'mouseup', toX, toY);
}

function assert(cond, msg) { if (!cond) throw new Error(msg); }

// Shelf's 4s safety-net re-render is gated on document.visibilityState, and
// it is the ONLY other thing that can place the conversation button. Under
// --virtual-time-budget its phase is deterministic, so it would rescue the
// button in every run and hide whether the catch-up poll works at all.
// Faking "hidden" mutes just that net — nothing else in content.js reads it.
function muteSafetyNet() {
  Object.defineProperty(document, 'visibilityState', { configurable: true, get: () => 'hidden' });
}
function unmuteSafetyNet() { delete document.visibilityState; }

async function waitFor(cond, timeout, what) {
  const t0 = Date.now();
  while (Date.now() - t0 < (timeout || 3000)) {
    const v = cond();
    if (v) return v;
    await sleep(100);
  }
  throw new Error('timed out waiting for ' + (what || 'condition'));
}

const results = [];
async function t(name, fn) {
  try {
    await fn();
    results.push({ name, ok: true });
  } catch (err) {
    const msg = String(err && err.message || err);
    if (msg.indexOf('SKIP') === 0) results.push({ name, ok: true, skip: true, err: msg });
    else results.push({ name, ok: false, err: msg });
  }
}

// drag drop-targeting uses elementsFromPoint, which needs a real viewport;
// hidden panes report 0x0 and can't hit-test
function needViewport(el) {
  if (window.innerHeight < 100) throw new Error('SKIP: zero-size viewport (hidden pane) — drag hit-testing unavailable');
  if (el) el.scrollIntoView({ block: 'center' });
}

(async () => {
  await sleep(500); // initial render

  await t('renders sections and Everything else', async () => {
    const names = $$('.shelf-header .shelf-name').map((n) => n.textContent);
    assert(names.join('|') === 'Summer|Eagle Peak|Everything else', 'got: ' + names.join('|'));
  });

  await t('labs: filed threads show their age (aging on)', async () => {
    // t1 was filed at epoch — decades old, so the counter must be hot
    const age = rowById('t1').querySelector('.shelf-age');
    assert(age, 'age counter missing on old filed thread');
    assert(/^\d+d$/.test(age.textContent), 'age text wrong: ' + age.textContent);
    assert(age.classList.contains('shelf-age-hot'), 'old thread not marked hot');
    assert(!rowById('t4').querySelector('.shelf-age'), 'unfiled thread should have no age');
  });

  await t('rapid Gmail row churn coalesces and regroups correctly', async () => {
    // simulate Gmail rebuilding the list twice in quick succession (what
    // keyboard nav does): the pre-paint scheduleSyncRender path must still
    // land every row in its section, with no loss or duplication
    const tb = document.querySelector('table.F tbody');
    const mk = (id, sec) => {
      store().assignments[id] = { s: sec, t: Date.now() };
      const tr = document.createElement('tr');
      tr.className = 'zA';
      tr.innerHTML = '<td style="width:0;padding:0"></td>' +
        '<td><span role="checkbox" aria-checked="false">▢</span></td>' +
        '<td><span data-legacy-thread-id="' + id + '"></span>Sender ' + id + '</td>' +
        '<td><span class="bog">Subject ' + id + '</span><ul role="toolbar"></ul></td>';
      return tr;
    };
    tb.appendChild(mk('rc1', 'aaa'));   // first burst
    await sleep(5);
    tb.appendChild(mk('rc2', 'bbb'));   // second burst within the throttle window
    await sleep(400);
    // both new rows grouped into their sections, exactly once each
    const seq = $$('tr.zA').map((r) => r.querySelector('[data-legacy-thread-id]').getAttribute('data-legacy-thread-id'));
    assert(seq.filter((x) => x === 'rc1').length === 1, 'rc1 duplicated or lost: ' + seq.join(','));
    assert(seq.filter((x) => x === 'rc2').length === 1, 'rc2 duplicated or lost');
    assert($$('.shelf-header').length >= 3, 'grouping missing after churn');
    // cleanup
    rowById('rc1').remove(); rowById('rc2').remove();
    delete store().assignments.rc1; delete store().assignments.rc2;
    const poke = document.createElement('i'); document.body.appendChild(poke);
    await sleep(200); poke.remove();
  });

  await t('review ask stays hidden until the install is a month old', async () => {
    assert(!$('.shelf-review'), 'banner shown at 14 days, before the 30-day window');
  });

  await t('review ask stays hidden on a month of dabbling', async () => {
    // age the install past 30 days but leave activity at 5 days: the old
    // 4-day bar would fire here, and that is exactly the ask we don't want
    const older = Date.now() - 45 * 24 * 60 * 60 * 1000;
    chrome.storage.local._d.firstUse = older;
    // the onChanged handler keeps the *earlier* firstUse, so an older stamp
    // is the only direction that moves
    chrome.storage.onChanged._fire({ firstUse: { newValue: older } }, 'local');
    await sleep(250);
    assert(!$('.shelf-review'), 'banner shown on only 5 active days');
  });

  await t('review banner shows on real habit, links to the store, dismiss persists', async () => {
    const days = ['2026-07-01', '2026-07-05', '2026-07-09', '2026-07-13',
                  '2026-07-17', '2026-07-21', '2026-07-25', '2026-07-29', '2026-08-02'];
    chrome.storage.local._d.fileDays = days;
    chrome.storage.onChanged._fire({ fileDays: { newValue: days } }, 'local');
    await sleep(250);
    const b = $('.shelf-review');
    assert(b, 'banner missing');
    // must be the published listing, not chrome.runtime.id — an unpacked
    // install's id is path-derived and 404s on the store
    const href = b.querySelector('.shelf-review-a').href;
    assert(href === 'https://chromewebstore.google.com/detail/dgomdjjoogkknnggfbggcdnlogkhdpng/reviews',
      'review link wrong: ' + href);
    clickEl(b.querySelector('.shelf-hint-x'));
    await sleep(250);
    assert(!$('.shelf-review'), 'banner not removed');
    assert(store().reviewDone === true, 'reviewDone not persisted');
  });

  await t('row drag files a thread onto a shelf', async () => {
    const row = rowById('t3');
    const hdr = headerBySec('aaa');
    needViewport(hdr);
    const [hx, hy] = center(hdr);
    // sample viewport state at drag time — elementsFromPoint (drop targeting)
    // returns nothing in a hidden/zero-size viewport; that's the environment,
    // not Shelf, and visibility can flip between drag and assert
    const vpAtDrag = document.elementsFromPoint(hx, hy)
      .some((n) => n.closest && n.closest('.shelf-header') === hdr);
    drag(row.children[2], hx, hy);
    await sleep(600);
    if (!(store().assignments.t3 && store().assignments.t3.s === 'aaa')) {
      if (!vpAtDrag) throw new Error('SKIP: viewport hidden during drag — hit-testing unavailable');
      throw new Error('assignment missing: ' + JSON.stringify(store().assignments.t3));
    }
  });

  await t('drag reorders threads within a section', async () => {
    // t1 and t3 both live in aaa now; drag t1 below t3
    const r1 = rowById('t1');
    const r3 = rowById('t3');
    needViewport(r3);
    const rr3 = r3.getBoundingClientRect();
    const cx = center(r3.children[2])[0];
    const vpAtDrag = document.elementsFromPoint(cx, rr3.bottom - 4)
      .some((n) => n.closest && n.closest('tr.zA') === r3);
    drag(r1.children[2], cx, rr3.bottom - 4);
    await sleep(600);
    const a1 = store().assignments.t1;
    const a3 = store().assignments.t3;
    if (!(a1 && a1.r != null)) {
      if (!vpAtDrag) throw new Error('SKIP: viewport hidden during drag — hit-testing unavailable');
      const stack = document.elementsFromPoint(cx, rr3.bottom - 4)
        .map((n) => n.tagName + '.' + String(n.className).slice(0, 24)).join(' | ');
      const ovg = [...document.querySelectorAll('.shelf-ov > *')]
        .map((h) => ((h.querySelector('.shelf-name') || {}).textContent || h.className) + '@' + Math.round(h.getBoundingClientRect().top)).join(', ');
      throw new Error('no rank stored: ' + JSON.stringify(a1) +
        ' | drop@' + Math.round(cx) + ',' + Math.round(rr3.bottom - 4) +
        ' | t3vis@' + Math.round(rowById('t3').getBoundingClientRect().top) +
        ' | stack: ' + stack + ' | ov: ' + ovg +
        ' | logs: ' + (window.__logs || []).filter((l) => /rowdrag|row drop/.test(l)).slice(-4).join(' ~ '));
    }
    assert(a1.s === 'aaa' && a3 && a3.s === 'aaa', 'sections changed');
    assert(a1.r > a3.r, 'rank order wrong: t1=' + a1.r + ' t3=' + a3.r);
    const seq2 = visualOrder();
    assert(seq2.indexOf('t1') > seq2.indexOf('t3'), 'visual order: ' + seq2.join(','));
  });

  await t('drag reorders threads within Everything else', async () => {
    // leftover (unfiled) rows must hand-order like a section's do. Find two
    // rows currently in "Everything else" — no assignment, or one pointing at
    // no real section — and drag the first below the second.
    const realIds = new Set(store().sections.Action.list.map((s) => s.id));
    const inElse = (tid) => { const a = store().assignments[tid]; return !a || !realIds.has(a.s); };
    const elseOrder = visualOrder().filter(inElse);
    assert(elseOrder.length >= 2, 'need 2 leftover rows, got: ' + elseOrder.join(','));
    const firstId = elseOrder[0];
    const secondId = elseOrder[1];
    const rFirst = rowById(firstId);
    const rSecond = rowById(secondId);
    needViewport(rSecond);
    const rr = rSecond.getBoundingClientRect();
    const cx = center(rSecond.children[2])[0];
    const vpAtDrag = document.elementsFromPoint(cx, rr.bottom - 4)
      .some((n) => n.closest && n.closest('tr.zA') === rSecond);
    drag(rFirst.children[2], cx, rr.bottom - 4); // drop first below second
    await sleep(600);
    const a1 = store().assignments[firstId];
    if (!(a1 && a1.r != null && a1.s === ':else')) {
      if (!vpAtDrag) throw new Error('SKIP: viewport hidden during drag — hit-testing unavailable');
      throw new Error('no else rank stored: ' + JSON.stringify(a1) +
        ' | firstId=' + firstId + ' secondId=' + secondId +
        ' | logs: ' + (window.__logs || []).filter((l) => /rowdrag|row drop/.test(l)).slice(-4).join(' ~ '));
    }
    assert(a1.s === ':else', 'leftover row was filed to a real section: ' + JSON.stringify(a1));
    const seq = visualOrder();
    assert(seq.indexOf(firstId) > seq.indexOf(secondId),
      'visual order not updated: ' + seq.join(','));
    // it still lives under "Everything else", not a new header
    assert([...$$('.shelf-header')].some((h) => h.classList.contains('shelf-else')),
      'Everything else header vanished');
  });

  // leftover-bucket helpers shared by the keyboard-reorder tests below
  const elseIds = () => {
    const realIds = new Set(store().sections.Action.list.map((s) => s.id));
    return visualOrder().filter((tid) => {
      const a = store().assignments[tid];
      return !a || !realIds.has(a.s);
    });
  };
  const nudge = async (tid, code) => {
    mouse(rowById(tid), 'mouseover');
    keyOn(document.body, { altKey: true, code, key: code });
    await sleep(400);
  };

  await t('Alt+↓/↑ nudges the hovered thread, and nudges accumulate', async () => {
    const before = elseIds();
    assert(before.length >= 3, 'need 3 leftover rows, got: ' + before.join(','));
    const mover = before[0];
    await nudge(mover, 'ArrowDown');
    assert(elseIds().indexOf(mover) === 1, 'one nudge → slot 1: ' + elseIds().join(','));
    // the second press must see the first one's result, not the stale order
    await nudge(mover, 'ArrowDown');
    assert(elseIds().indexOf(mover) === 2, 'nudges must accumulate: ' + elseIds().join(','));
    await nudge(mover, 'ArrowUp');
    assert(elseIds().indexOf(mover) === 1, 'ArrowUp walks it back: ' + elseIds().join(','));
    const a = store().assignments[mover];
    assert(a && a.r != null && a.s === ':else', 'rank not persisted: ' + JSON.stringify(a));
  });

  await t('arranging a second thread preserves the first one’s placement', async () => {
    // Regression: assignManyAt used to rebuild each bucket from Gmail's date
    // order, so placing a second thread renumbered the first back to the top.
    const start = elseIds();
    assert(start.length >= 4, 'need 4 leftover rows, got: ' + start.join(','));
    const anchor = start[0];
    await nudge(anchor, 'ArrowDown');
    await nudge(anchor, 'ArrowDown');
    const mid = elseIds();
    const anchorAt = mid.indexOf(anchor);
    assert(anchorAt === 2, 'anchor should sit at slot 2: ' + mid.join(','));
    // now arrange a DIFFERENT thread; the anchor must not move
    const other = mid[mid.length - 1];
    await nudge(other, 'ArrowUp');
    const end = elseIds();
    assert(end.indexOf(other) === end.length - 2, 'other row did not move: ' + end.join(','));
    assert(end.indexOf(anchor) === anchorAt,
      'anchor shifted when another thread was arranged: ' + end.join(','));
  });

  // Gmail's cursor row is focused (that's how screen readers follow j/k); the
  // pointer, meanwhile, is wherever it was last abandoned.
  const putCursorOn = async (tid) => {
    $$('tr.zA').forEach((x) => x.setAttribute('tabindex', '-1')); // roving: exactly one 0
    const r = rowById(tid);
    r.setAttribute('tabindex', '0');
    r.focus();
    await sleep(25);
  };
  const parkPointerOn = async (tid) => { mouse(rowById(tid), 'mouseover'); await sleep(25); };

  await t('Alt+↓ follows Gmail’s cursor row, not where the mouse is parked', async () => {
    const before = elseIds();
    assert(before.length >= 3, 'need 3 leftover rows: ' + before.join(','));
    const cursorId = before[0];
    const parkedId = before[2];
    await parkPointerOn(parkedId);   // pointer abandoned over an unrelated thread
    await putCursorOn(cursorId);     // then the person drives with the keyboard
    keyOn(document.body, { altKey: true, code: 'ArrowDown', key: 'ArrowDown' });
    await sleep(400);
    const after = elseIds();
    assert(after.indexOf(cursorId) === before.indexOf(cursorId) + 1,
      'cursor row did not move: ' + after.join(','));
    assert(after.indexOf(parkedId) === before.indexOf(parkedId),
      'the parked-under-pointer row moved instead: ' + after.join(','));
    rowById(cursorId).blur();
  });

  await t('moving the mouse hands targeting back to the pointer', async () => {
    const before = elseIds();
    const cursorId = before[0];
    const parkedId = before[2];
    await putCursorOn(cursorId);     // keyboard drove last...
    await parkPointerOn(parkedId);   // ...then the mouse actually moves
    keyOn(document.body, { altKey: true, code: 'ArrowDown', key: 'ArrowDown' });
    await sleep(400);
    const after = elseIds();
    assert(after.indexOf(parkedId) === before.indexOf(parkedId) + 1,
      'hovered row did not move: ' + after.join(','));
    assert(after.indexOf(cursorId) === before.indexOf(cursorId),
      'cursor row moved though the mouse was in charge: ' + after.join(','));
    rowById(cursorId).blur();
  });

  // ---- labs.cursor: Shelf steers GMAIL's cursor through the painted order ----
  const gmailCurTid = () => {
    const r = $$('tr.zA').find((x) => x.getAttribute('tabindex') === '0');
    return r ? r.querySelector('[data-legacy-thread-id]').getAttribute('data-legacy-thread-id') : null;
  };
  const putGmailCursorOn = async (tid) => {
    const cb = rowById(tid).querySelector('[role="checkbox"]');
    cb.click(); cb.click();   // net-zero on selection — the same lever Shelf uses
    await sleep(60);
  };
  const selCount = () => $$('tr.zA').filter((r) => {
    const c = r.querySelector('[role="checkbox"]');
    return c && c.getAttribute('aria-checked') === 'true';
  }).length;
  const plainKey = (code, key) => {
    const ev = new KeyboardEvent('keydown', { bubbles: true, cancelable: true, code, key });
    document.body.dispatchEvent(ev);
    return ev;
  };

  await t('labs cursor: j/k move Gmail\u2019s own cursor in VISUAL order', async () => {
    const seen = visualOrder();
    const dom = $$('tr.zA')
      .filter((r) => r.offsetParent && !r.classList.contains('shelf-hidden'))
      .map((r) => r.querySelector('[data-legacy-thread-id]').getAttribute('data-legacy-thread-id'));
    assert(JSON.stringify(dom) !== JSON.stringify(seen),

  await t('note editor: ⌘⇧8/9 formatting shortcuts', async () => {
    const pane = document.createElement('div');
    pane.innerHTML = '<div><h2 data-legacy-thread-id="t8">Subject eight</h2></div>';
    document.body.appendChild(pane);
    await sleep(400);
    keyOn(document.body, { altKey: true, code: 'KeyN', key: 'n' });
    const ed = $('.shelf-note-strip.shelf-editing .shelf-note-strip-t');
    assert(ed, 'editor did not open');
    ed.focus();
    ed.textContent = 'steps';
    const range = document.createRange();
    range.selectNodeContents(ed);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    keyOn(ed, { metaKey: true, shiftKey: true, code: 'Digit8', key: '8' });
    const gotUl = !!ed.querySelector('ul');
    keyOn(ed, { metaKey: true, shiftKey: true, code: 'Digit9', key: '9' });
    const gotCb = !!ed.querySelector('input[type="checkbox"]');
    let enterOk = true;
    let enterMsg = '';
    if (gotUl && gotCb) {
      // Enter continues a checklist; Enter on an empty box ends it
      ed.innerHTML = '';
      const r3 = document.createRange();
      r3.selectNodeContents(ed);
      sel.removeAllRanges();
      sel.addRange(r3);
      document.execCommand('insertHTML', false, '<input type="checkbox">&nbsp;task one');
      keyOn(ed, { key: 'Enter' });
      if (ed.querySelectorAll('input[type="checkbox"]').length !== 2) {
        enterOk = false;
        enterMsg = 'Enter did not continue checklist: ' + ed.innerHTML;
      }
      keyOn(ed, { key: 'Enter' });
      if (enterOk && ed.querySelectorAll('input[type="checkbox"]').length !== 1) {
        enterOk = false;
        enterMsg = 'Enter on empty box did not end checklist: ' + ed.innerHTML;
      }
      // ⌘⇧9 while on a checkbox line = next item, break included (the
      // "skips a line" fix): caret is back on the 'task one' line now
      keyOn(ed, { metaKey: true, shiftKey: true, code: 'Digit9', key: '9' });
      if (enterOk && !(ed.querySelectorAll('input[type="checkbox"]').length === 2 && /(<br>|<div>)/.test(ed.innerHTML))) {
        enterOk = false;
        enterMsg = '⌘⇧9 on a checkbox line did not start a new row: ' + ed.innerHTML;
      }
    }
    ed.innerHTML = '';
    keyOn(ed, { key: 'Escape' });
    await sleep(300);
    pane.remove();
    await sleep(200);
    if (!gotUl || !gotCb) {
      // headless Chrome ignores execCommand entirely (same reason the ⌘K
      // test simulates createLink's outcome) — probe before failing
      const probe = document.createElement('div');
      probe.contentEditable = 'true';
      probe.textContent = 'x';
      document.body.appendChild(probe);
      probe.focus();
      const r2 = document.createRange();
      r2.selectNodeContents(probe);
      sel.removeAllRanges();
      sel.addRange(r2);
      document.execCommand('insertUnorderedList');
      const envOk = !!probe.querySelector('ul');
      probe.remove();
      if (!envOk) throw new Error('SKIP: execCommand unavailable in this environment');
      throw new Error('shortcuts failed: ul=' + gotUl + ' cb=' + gotCb);
    }
    assert(enterOk, enterMsg);
  });

  });

  await t('a11y: controls are buttons with labels', async () => {
    const h = $('.shelf-header .shelf-h');
    assert(h.getAttribute('role') === 'button' && h.getAttribute('tabindex') === '0', 'header not a button');
    assert(h.getAttribute('aria-expanded') !== null, 'no aria-expanded');
    const nb = $('.shelf-btn-note');
    assert(nb.getAttribute('aria-label'), 'note btn unlabeled');
  });

  await t('accounts are isolated (u/1 sees no u/0 sections)', async () => {
    // renders in a hidden pane ride solely on observer ticks — poke a
    // mutation and poll rather than trusting fixed sleeps
    const pokeUntil = async (cond) => {
      const t0 = Date.now();
      while (Date.now() - t0 < 4000) {
        if (cond()) return true;
        const i = document.createElement('i');
        document.body.appendChild(i);
        await sleep(200);
        i.remove();
        await sleep(100);
      }
      return cond();
    };
    const n0 = $$('.shelf-header').length; // whatever the suite built so far
    history.pushState({}, '', '/mail/u/1/' + location.hash);
    const u1cleared = await pokeUntil(() => $$('.shelf-header').length === 0);
    const u1count = $$('.shelf-header').length;
    history.pushState({}, '', '/tools/test.html' + location.hash);
    const u0restored = await pokeUntil(() => $$('.shelf-header').length === n0);
    const u0count = $$('.shelf-header').length;
    assert(u1cleared, 'u/1 saw ' + u1count + ' headers');
    assert(u0restored, 'u/0 restore saw ' + u0count + ' (expected ' + n0 + ')');
  });

  await t('duplicate rows are Gmail\'s to manage — Shelf never removes a tr', async () => {
    // Under the pristine-tbody rule even a duplicate row must not be
    // removed by Shelf (removal shifts the click map exactly like insertion).
    const tbEl = document.getElementById('tb');
    const dup = document.createElement('tr');
    dup.className = 'zA';
    dup.innerHTML =
      '<td style="width:0;padding:0"></td>' +
      '<td><span role="checkbox" aria-checked="false">▢</span></td>' +
      '<td><span data-legacy-thread-id="t1" email="dup@ex.com"></span>Dup</td>' +
      '<td><span class="bog">Dup subject</span><ul role="toolbar"></ul></td>';
    tbEl.appendChild(dup);
    const poke = document.createElement('i');
    document.body.appendChild(poke);
    await sleep(400);
    poke.remove();
    assert(dup.isConnected, 'Shelf removed a Gmail row');
    dup.remove();
    await sleep(200);
  });

  await t('transform cleanup survives Gmail rewriting row classes', async () => {
    // Gmail rewrites row class attributes wholesale, which strips any Shelf
    // marker classes. Cleanup must sweep transforms by inline style, or a
    // stripped row stays visually displaced after grouping ends.
    const moved = $$('tr.zA').find((r) => r.style.transform);
    assert(moved, 'expected at least one transformed row in grouped state');
    moved.setAttribute('class', 'zA'); // simulate Gmail's wholesale rewrite
    location.hash = '#search/x';       // label-less view → full cleanup path
    window.dispatchEvent(new HashChangeEvent('hashchange'));
    await sleep(500);
    const stuck = $$('tr.zA').filter((r) => r.style.transform).length;
    assert(stuck === 0, stuck + ' rows kept stale transforms after cleanup');
    history.replaceState({}, '', location.pathname + '#label/Action');
    window.dispatchEvent(new HashChangeEvent('hashchange'));
    await sleep(400);
  });

  // report
  const out = document.getElementById('out');
  let passed = 0;
  for (const r of results) {
    const d = document.createElement('div');
    d.className = r.ok ? 'ok' : 'fail';
    d.textContent = (r.skip ? 'SKIP  ' : r.ok ? 'PASS  ' : 'FAIL  ') + r.name +
      (r.ok && !r.skip ? '' : ' — ' + (r.err || ''));
    out.appendChild(d);
    if (r.ok) passed++;
  }
  const sum = document.createElement('div');
  sum.style.marginTop = '10px';
  sum.style.fontWeight = 'bold';
  sum.textContent = passed + '/' + results.length + ' passed';
  out.appendChild(sum);
  window.__results = results;
  window.__done = true;
  document.title = passed === results.length ? 'PASS ' + passed + '/' + results.length
                                             : 'FAIL ' + passed + '/' + results.length;
})();
</script>
